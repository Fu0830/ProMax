<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圣诞贺卡工坊 by 小鱼</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Pacifico&family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
  :root{
    --bg1:#0b0a18; --bg2:#05030d;
    --panel:#1a1830; --panel2:#221f3d;
    --line:#3a3560; --text:#f3f0fb; --muted:#a9a4cc;
    --accent:#c9a8ff; --gold:#f3c969;
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:var(--text);
    background:
      radial-gradient(1200px 700px at 80% -10%, #2a2450 0%, transparent 60%),
      radial-gradient(1000px 600px at -10% 110%, #241a38 0%, transparent 55%),
      linear-gradient(160deg,var(--bg1),var(--bg2));
    min-height:100vh;
    padding:24px 18px 60px;
  }
  .wrap{max-width:1180px;margin:0 auto}
  header.top{text-align:center;margin-bottom:22px}
  header.top h1{
    font-family:"Pacifico","Noto Serif SC",serif;font-weight:400;font-size:32px;letter-spacing:1px;
    background:linear-gradient(90deg,#ffd98a,#d9b8ff,#9fd8ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header.top p{color:var(--muted);margin-top:8px;font-size:14px}
  .layout{display:grid;grid-template-columns:380px 1fr;gap:22px;align-items:start}
  @media (max-width:920px){.layout{grid-template-columns:1fr}}

  .panel{
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;box-shadow:0 18px 40px rgba(0,0,0,.45);
  }
  .panel h2{font-size:15px;letter-spacing:1px;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .panel h2::before{content:"";width:6px;height:16px;border-radius:3px;background:var(--accent)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .field input[type=text],.field textarea{
    width:100%;background:#0e0c1e;border:1px solid var(--line);border-radius:12px;
    color:var(--text);padding:10px 12px;font-size:14px;font-family:inherit;outline:none;
    transition:border-color .2s;
  }
  .field input:focus,.field textarea:focus{border-color:var(--accent)}
  .field textarea{resize:vertical;min-height:84px;line-height:1.7}
  .colors{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .color-item{display:flex;align-items:center;gap:10px;background:#0e0c1e;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
  .color-item input[type=color]{
    width:38px;height:38px;border:none;border-radius:10px;background:none;cursor:pointer;padding:0;
  }
  .color-item input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  .color-item input[type=color]::-webkit-color-swatch{border:1px solid var(--line);border-radius:10px}
  .color-item span{font-size:13px}
  .presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip{
    border:1px solid var(--line);background:#0e0c1e;color:var(--text);border-radius:999px;
    padding:7px 13px;font-size:13px;cursor:pointer;transition:all .15s;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip.active{background:var(--accent);color:#1a1030;border-color:var(--accent);font-weight:600}

  .stage{position:sticky;top:20px}
  .canvas-box{
    background:linear-gradient(180deg,#151228,#0c0a1a);
    border:1px solid var(--line);border-radius:var(--radius);padding:18px;
    display:flex;justify-content:center;box-shadow:0 18px 40px rgba(0,0,0,.45);
  }
  canvas#stage{width:100%;max-width:520px;height:auto;border-radius:14px;display:block;cursor:pointer}
  .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
  .btn{
    border:none;border-radius:14px;padding:14px 12px;font-size:14px;font-weight:600;cursor:pointer;
    font-family:inherit;letter-spacing:.5px;transition:transform .12s,filter .15s;
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{background:linear-gradient(135deg,#a87ae8,#7a4fc0);color:#fff}
  .btn.gold{background:linear-gradient(135deg,#f3c969,#e0a93f);color:#2a1f05}
  .btn.ghost{background:#221f3d;color:var(--text);border:1px solid var(--line)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .field .filebtn{
    display:inline-flex;width:auto;align-items:center;justify-content:center;
    padding:11px 16px;border-radius:12px;cursor:pointer;
    border:1px solid rgba(180,140,242,.55);
    background:linear-gradient(135deg,rgba(180,140,242,.32),rgba(233,216,255,.22));
    color:#f5edff;font-size:14px;transition:.2s;margin-bottom:0;
  }
  .filebtn:hover{background:rgba(180,140,242,.45)}
  .filebtn input{display:none}
  .video-box{margin-top:14px;display:flex;flex-direction:column;gap:8px;align-items:center}
  .video-box[hidden]{display:none}
  .video-box video{width:100%;max-width:320px;border-radius:14px;border:1px solid rgba(180,140,242,.35);background:#000}
  .video-tip{margin:0;font-size:12px;color:#b9aad6;text-align:center}
  .hint{margin-top:12px;font-size:12.5px;color:var(--muted);text-align:center;line-height:1.7}
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    background:#0e0c1e;border:1px solid var(--accent);color:var(--accent);padding:12px 20px;
    border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:99;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>🎄 圣诞贺卡工坊 by 小鱼</h1>
    <p>星尘螺旋圣诞树 · 信封拆信开场 · 自定义配色与祝福，可保存图片与带背景音乐的翻卡视频</p>
  </header>

  <div class="layout">
    <!-- ===== 控制面板 ===== -->
    <section class="panel">
      <h2>✍️ 贺卡文案</h2>
      <div class="field"><label>收件人（称呼）</label><input type="text" id="inTo" maxlength="20"></div>
      <div class="field"><label>封面标题</label><input type="text" id="inTitle" maxlength="30" value="Merry Christmas"></div>
      <div class="field"><label>祝福内容（可换行）</label><textarea id="inMsg" maxlength="200">愿这个冬天有雪花、有星辰、有温热的拥抱，
也有被星光照亮的好运气。
新的一年，平安喜乐，万事胜意。</textarea></div>
      <div class="field"><label>署名</label><input type="text" id="inFrom" maxlength="20"></div>
      <div class="field"><label>日期</label><input type="text" id="inDate" maxlength="20" value="2026.12.25"></div>

      <h2 style="margin-top:22px">👤 两侧头像与名字</h2>
      <div class="field"><label>左侧头像</label>
        <label class="filebtn" for="avA"><span id="avATxt">🖼 选择图片</span><input type="file" id="avA" accept="image/*"></label>
      </div>
      <div class="field"><label>左侧名字（1–4 字）</label><input type="text" id="capA" maxlength="4"></div>
      <div class="field"><label>右侧头像</label>
        <label class="filebtn" for="avB"><span id="avBTxt">🖼 选择图片</span><input type="file" id="avB" accept="image/*"></label>
      </div>
      <div class="field"><label>右侧名字（1–4 字）</label><input type="text" id="capB" maxlength="4"></div>
      <button class="chip" id="btnClearAv" style="margin-top:10px">🧹 清空两侧头像</button>

      <h2 style="margin-top:22px">✨ 星尘配色</h2>
      <div class="colors">
        <div class="color-item"><input type="color" id="cTree" value="#b48cf2"><span>星云主色</span></div>
        <div class="color-item"><input type="color" id="cOrn" value="#f3e8ff"><span>高光粒子</span></div>
        <div class="color-item"><input type="color" id="cLight" value="#ffffff"><span>星尘闪光</span></div>
        <div class="color-item"><input type="color" id="cStar" value="#ffffff"><span>顶星</span></div>
        <div class="color-item"><input type="color" id="cGift" value="#7a5aa8"><span>雾气光晕</span></div>
        <div class="color-item"><input type="color" id="cAccent" value="#e9d8ff"><span>标题描边</span></div>
        <div class="color-item"><input type="color" id="cBg" value="#05030d"><span>背景夜色</span></div>
        <div class="color-item"><input type="color" id="cCard" value="#0d0a1a"><span>卡片底色</span></div>
      </div>
      <div class="presets" id="presets"></div>
    </section>

    <!-- ===== 预览与导出 ===== -->
    <section class="stage">
      <div class="canvas-box"><canvas id="stage" width="1080" height="1440"></canvas></div>
      <div class="actions">
        <button class="btn ghost" id="btnFlip">✉️ 拆信 / 翻开</button>
        <button class="btn ghost" id="btnClose">🔒 合上贺卡</button>
        <button class="btn gold" id="btnImgCover">🖼 保存封面图</button>
        <button class="btn gold" id="btnImgInside">🖼 保存内页图</button>
        <button class="btn primary" id="btnVideo">🎬 录制视频</button>
        <button class="btn ghost" id="btnMusic">🎵 音乐</button>
      </div>
      <div class="video-box" id="videoBox" hidden>
        <video id="videoPreview" controls playsinline muted></video>
        <p class="video-tip">已自动下载 · 手机上若未自动保存，长按视频选择「存储视频」</p>
      </div>
      <p class="hint">视频含信封拆信开场 + 翻卡动画，总长约 10 秒，并配上圣诞背景音乐；图片为高清 PNG。<br>手机上若没听到音乐，点一下「🎵 音乐」手动开启。</p>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>

function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ============================================================
 * 工具函数
 * ============================================================ */
function hexToRgb(h){
  h=h.replace('#',''); if(h.length===3)h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16); return {r:(n>>16)&255,g:(n>>8)&255,b:n&255};
}
function mix(hex,target,amt){
  const a=hexToRgb(hex), b=hexToRgb(target);
  const r=Math.round(a.r+(b.r-a.r)*amt), g=Math.round(a.g+(b.g-a.g)*amt), bl=Math.round(a.b+(b.b-a.b)*amt);
  return `rgb(${r},${g},${bl})`;
}
function mixHex(hex,target,amt){
  const a=hexToRgb(hex), b=hexToRgb(target);
  const r=Math.round(a.r+(b.r-a.r)*amt), g=Math.round(a.g+(b.g-a.g)*amt), bl=Math.round(a.b+(b.b-a.b)*amt);
  const h=x=>x.toString(16).padStart(2,'0');
  return '#'+h(r)+h(g)+h(bl);
}
function rgba(hex,alpha){const c=hexToRgb(hex);return `rgba(${c.r},${c.g},${c.b},${alpha})`}
function clamp01(x){return Math.min(1,Math.max(0,x))}
function lerp(a,b,t){return a+(b-a)*t}
function easeOut(x){return 1-Math.pow(1-x,3)}
function easeIn(x){return x*x*x}

function wrapText(c,text,maxW){
  const lines=[];
  text.split('\n').forEach(para=>{
    let line='';
    for(const ch of para){
      if(c.measureText(line+ch).width>maxW && line){lines.push(line);line=ch;}
      else line+=ch;
    }
    lines.push(line);
  });
  return lines;
}
function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

function drawBackgroundOn(c){
  const g=c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,state.col.bg);
  g.addColorStop(1,mix(state.col.bg,'#000000',0.4));
  c.fillStyle=g;c.fillRect(0,0,W,H);
  STARS.forEach(s=>{
    c.beginPath();c.fillStyle=`rgba(255,255,255,${s.o})`;
    c.arc(s.x,s.y,s.r,0,Math.PI*2);c.fill();
  });
  SNOW.forEach(s=>{
    c.beginPath();c.fillStyle=`rgba(255,255,255,${s.o})`;
    c.arc(s.x,s.y,s.r,0,Math.PI*2);c.fill();
  });
}

/* ============================================================
 * 顶星：四角闪光 + 星芒 + 光晕
 * ============================================================ */
function drawGlowStarOn(c,cx,cy,size,color){
  const halo=c.createRadialGradient(cx,cy,0,cx,cy,size*2.6);
  halo.addColorStop(0,rgba(color,.55));
  halo.addColorStop(1,rgba(color,0));
  c.fillStyle=halo;
  c.beginPath();c.arc(cx,cy,size*2.6,0,Math.PI*2);c.fill();
  c.save();
  c.strokeStyle=color;c.lineWidth=2;c.globalAlpha=.85;
  c.beginPath();
  c.moveTo(cx-size*1.8,cy);c.lineTo(cx+size*1.8,cy);
  c.moveTo(cx,cy-size*1.8);c.lineTo(cx,cy+size*1.8);
  c.stroke();
  c.beginPath();
  const pts=[[0,-1],[0.28,-0.28],[1,0],[0.28,0.28],[0,1],[-0.28,0.28],[-1,0],[-0.28,-0.28]];
  pts.forEach((p,i)=>{
    const x=cx+p[0]*size, y=cy+p[1]*size;
    i===0?c.moveTo(x,y):c.lineTo(x,y);
  });
  c.closePath();
  c.fillStyle=color;c.fill();
  c.restore();
}

/* ============================================================
 * 星尘螺旋粒子圣诞树
 * ============================================================ */
function drawStarTreeOn(c,cx,baseY,treeH,pal,opt){
  opt=opt||{};
  const gain=opt.gain||1, dotMul=opt.dotMul||1, halo=opt.halo||0;
  const R=treeH*0.38;
  const layers=8;
  const sy=0.30;

  if(halo){
    const gy=baseY-treeH*0.42;
    const g=c.createRadialGradient(cx,gy,0,cx,gy,R*1.7);
    g.addColorStop(0,rgba(pal.tree,halo));
    g.addColorStop(0.55,rgba(pal.tree,halo*0.35));
    g.addColorStop(1,rgba(pal.tree,0));
    c.save();c.fillStyle=g;
    c.beginPath();c.ellipse(cx,gy,R*1.7,R*1.7*1.05,0,0,Math.PI*2);c.fill();c.restore();
  }

  c.save();
  c.globalCompositeOperation='lighter';

  for(let k=0;k<170;k++){
    const t=rnd();
    const y=baseY-t*treeH;
    const r=R*Math.pow(1-t,0.8);
    const x=cx+(rnd()-0.5)*2*r;
    c.globalAlpha=Math.min(1,(0.05+rnd()*0.10)*gain);
    c.fillStyle=pal.gift;
    c.beginPath();c.arc(x,y+(rnd()-0.5)*22,(1+rnd()*3)*dotMul,0,Math.PI*2);c.fill();
  }

  for(let i=0;i<layers;i++){
    const t=i/(layers-1);
    const y=baseY-t*treeH;
    const r=R*Math.pow(1-t,0.8)+6;
    const count=Math.round(46*(1-t)+16);
    const twist=t*Math.PI*2;

    c.globalAlpha=Math.min(1,0.16*gain);
    c.strokeStyle=pal.tree;c.lineWidth=treeH*0.018;
    c.beginPath();c.ellipse(cx,y,r,r*sy,0,0,Math.PI*2);c.stroke();

    for(let j=0;j<count;j++){
      const th=(j/count)*Math.PI*2+twist;
      const rr=r*(0.82+rnd()*0.36);
      const x=cx+Math.cos(th)*rr;
      const yy=y+Math.sin(th)*rr*sy;
      const mv=rnd();
      c.globalAlpha=Math.min(1,(0.35+rnd()*0.6)*gain);
      c.fillStyle=mv>0.62?pal.light:(mv>0.32?pal.ornament:pal.tree);
      c.beginPath();c.arc(x,yy,(1+rnd()*2.2)*dotMul,0,Math.PI*2);c.fill();
    }
  }
  c.restore();

  c.save();c.globalCompositeOperation='lighter';
  for(let k=0;k<90;k++){
    const t=rnd();
    const y=baseY-t*treeH;
    const r=R*Math.pow(1-t,0.8)*0.3;
    c.globalAlpha=Math.min(1,(0.10+rnd()*0.25)*gain);
    c.fillStyle=pal.ornament;
    c.beginPath();c.arc(cx+(rnd()-0.5)*r,y,(1+rnd()*1.8)*dotMul,0,Math.PI*2);c.fill();
  }
  c.restore();

  drawGlowStarOn(c,cx,baseY-treeH-treeH*0.04,treeH*0.062,pal.star);

  c.save();
  for(let k=0;k<6;k++){
    const rr=R*(0.4+k*0.28);
    c.globalAlpha=Math.max(0.04,0.12-k*0.013);
    c.strokeStyle=pal.tree;c.lineWidth=2;
    c.beginPath();c.ellipse(cx,baseY+12,rr,rr*0.18,0,0,Math.PI*2);c.stroke();
  }
  const core=c.createRadialGradient(cx,baseY+12,0,cx,baseY+12,R*0.5);
  core.addColorStop(0,rgba(pal.tree,.5));
  core.addColorStop(1,rgba(pal.tree,0));
  c.fillStyle=core;
  c.beginPath();c.ellipse(cx,baseY+12,R*0.5,R*0.16,0,0,Math.PI*2);c.fill();
  c.restore();
  c.globalAlpha=1;
}

/* 雪橇彗尾 + emoji */
function drawSleighOn(c,x1,y1,x2,y2,pal){
  const mx=(x1+x2)/2, my=Math.min(y1,y2)-40;
  const grad=c.createLinearGradient(x1,y1,x2,y2);
  grad.addColorStop(0,rgba(pal.light,.05));
  grad.addColorStop(0.5,rgba(pal.tree,.7));
  grad.addColorStop(1,rgba('#f3c969',.8));
  c.save();
  c.strokeStyle=grad;c.lineWidth=5;c.lineCap='round';
  c.beginPath();c.moveTo(x1,y1);c.quadraticCurveTo(mx,my,x2,y2);c.stroke();
  for(let k=0;k<24;k++){
    const t=k/24;
    const px=(1-t)*(1-t)*x1+2*(1-t)*t*mx+t*t*x2;
    const py=(1-t)*(1-t)*y1+2*(1-t)*t*my+t*t*y2;
    c.globalAlpha=0.25+0.5*(1-t);
    c.fillStyle=k%2?pal.light:pal.tree;
    c.beginPath();c.arc(px+(rnd()-0.5)*14,py+(rnd()-0.5)*10,1+rnd()*2,0,Math.PI*2);c.fill();
  }
  c.globalAlpha=1;
  c.font="34px serif";c.textAlign="center";
  c.fillText("🎅🦌🦌",x2,y2+12);
  c.restore();
}

function cardFrameOn(c){
  const m=64;
  c.save();

function drawAvatarSlotOn(c,x,y,r,img,cap){
  c.save();
  /* 环形光晕 */
  const halo=c.createRadialGradient(x,y,r*0.55,x,y,r*1.45);
  halo.addColorStop(0,rgba(state.col.tree,img?0.20:0.08));
  halo.addColorStop(0.62,rgba(state.col.tree,img?0.06:0.02));
  halo.addColorStop(1,rgba(state.col.tree,0));
  c.fillStyle=halo;
  c.beginPath();c.arc(x,y,r*1.45,0,Math.PI*2);c.fill();

  if(img&&img.width){
    c.save();
    c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.clip();
    const s=Math.max((2*r)/img.width,(2*r)/img.height);
    const w=img.width*s,h=img.height*s;
    c.drawImage(img,x-w/2,y-h/2,w,h);
    c.restore();
  }else{
    /* 空槽：极淡星空底 + 虚线圈，明确是可放置头像的位置 */
    const inner=c.createRadialGradient(x,y,0,x,y,r);
    inner.addColorStop(0,rgba(state.col.accent,0.045));
    inner.addColorStop(1,rgba(state.col.accent,0.012));
    c.fillStyle=inner;
    c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();

    c.save();

    c.strokeStyle=rgba(state.col.accent,0.26);
    c.lineWidth=2;
    c.beginPath();c.arc(x,y,r-7,0,Math.PI*2);c.stroke();

  }

  /* 双环描边 */
  c.strokeStyle=rgba(state.col.accent,img?0.80:0.45);
  c.lineWidth=4;
  c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.stroke();

  c.strokeStyle=rgba(state.col.tree,0.38);

}

function renderProgress(p){

}

/* ============================================================
 * 信封开场场景
 * ============================================================ */
function drawWaxSeal(c,x,y,r){
  const g=c.createRadialGradient(x-r*0.3,y-r*0.3,r*0.2,x,y,r);
  g.addColorStop(0,'#ecc887');g.addColorStop(1,'#a87f3e');
  c.beginPath();c.fillStyle=g;c.arc(x,y,r,0,Math.PI*2);c.fill();
  c.lineWidth=3;c.strokeStyle='rgba(90,60,20,.5)';c.stroke();
  c.beginPath();c.arc(x,y,r*0.72,0,Math.PI*2);
  c.strokeStyle='rgba(255,240,200,.5)';c.lineWidth=2;c.stroke();
  /* 压纹八角星 */
  c.beginPath();
  for(let i=0;i<10;i++){
    const rr=i%2===0?r*0.42:r*0.18;
    const a=(Math.PI/5)*i-Math.PI/2;
    const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr;
    i===0?c.moveTo(px,py):c.lineTo(px,py);
  }
  c.closePath();c.fillStyle='rgba(90,60,20,.45)';c.fill();
}

function drawMiniCard(c,cx,top,w,h){
  c.fillStyle='#fff8ee';roundRect(c,cx-w/2,top,w,h,16);c.fill();
  c.strokeStyle=rgba(state.col.accent,.4);c.lineWidth=3;c.stroke();
  c.textAlign="center";
  c.fillStyle=state.col.accent;
  c.font=`400 32px "Pacifico",cursive`;
  c.fillText(state.title||"Merry Christmas",cx,top+48);
  drawStarTreeOn(c,cx,top+h-70,220,state.col);
}

/* p: 0 闭合信封 → 1 拆信完成 */
function drawEnvelopeScene(c,p,now=0){
  drawBackgroundOn(c);
  const cx=W/2;
  const envX=cx-270, envY=700, envW=540, envH=380;
  const cardW=420, cardH=480;

  const sealP =clamp01(p/0.15);
  const flapP =clamp01((p-0.15)/0.20);
  const riseP =easeOut(clamp01((p-0.35)/0.50));
  const fadeP =clamp01((p-0.85)/0.15);

  /* 呼吸浮动（仅静止阶段） */
  const floatY = p===0 ? Math.sin(now/600)*10 : 0;
  const envAlpha=clamp01(1-fadeP*1.5);
  const envSink=fadeP*40;

  const cardBottom0=envY+envH-120;
  const cardBottom1=envY+30-60*fadeP;
  const cardBottom=lerp(cardBottom0,cardBottom1,riseP)+floatY;
  const cardTop=cardBottom-cardH;
  const cardScale=1+fadeP*0.25;

  /* 信封后体 */
  c.save();
  c.globalAlpha=envAlpha;
  c.translate(0,envSink+floatY);
  c.shadowColor="rgba(0,0,0,.5)";c.shadowBlur=40;c.shadowOffsetY=18;
  c.fillStyle='#f1e7d2';roundRect(c,envX,envY,envW,envH,20);c.fill();
  c.restore();

  /* 卡片（信封后体之上、前瓣之下）；闭合时不绘制 */
  if(riseP>0.02){
    c.save();
    c.globalAlpha=envAlpha;
    c.translate(cx,cardBottom);c.scale(cardScale,cardScale);c.translate(-cx,-cardBottom);
    drawMiniCard(c,cx,cardTop,cardW,cardH);
    c.restore();
  }

  c.save();
  c.globalAlpha=envAlpha;
  c.translate(0,envSink+floatY);

  /* 左右前瓣 */
  c.fillStyle='#e7d9bc';
  c.beginPath();
  c.moveTo(envX,envY+envH);c.lineTo(cx,envY+190);c.lineTo(envX+envW/2,envY+envH);
  c.closePath();c.fill();
  c.beginPath();
  c.moveTo(envX+envW,envY+envH);c.lineTo(cx,envY+190);c.lineTo(envX+envW/2,envY+envH);
  c.closePath();c.fill();

  /* 上盖 flap（翻开后隐藏） */
  if(flapP<1){
    c.globalAlpha=envAlpha*(1-flapP);
    c.fillStyle='#efe3c8';
    c.beginPath();
    c.moveTo(envX,envY);c.lineTo(envX+envW,envY);c.lineTo(cx,envY+190);
    c.closePath();c.fill();
  }

  /* 火漆印 */
  if(sealP<1){
    const sy=envY+190-22*sealP;
    c.globalAlpha=envAlpha*(1-sealP);
    drawWaxSeal(c,cx,sy,58*(1-0.35*sealP));
  }
  c.restore();

  /* 信封下方花体字 */
  c.textAlign="center";
  c.fillStyle=rgba(state.col.accent,.85);
  c.font=`400 34px "Pacifico",cursive`;
  c.fillText('A Letter Never Sent',cx,envY+envH+90);

  if(p===0){
    c.globalAlpha=0.6+0.4*Math.sin(now/500);
    c.fillStyle=state.col.accent;
    c.font=`400 28px "Noto Sans SC",sans-serif`;
    c.fillText('✉️ 轻触信封，拆开圣诞祝福',cx,envY+envH+150);
    c.globalAlpha=1;
  }
}

/* ============================================================
 * 阶段状态机（预览）
 * ============================================================ */
let stage='envelope'; // envelope | opening | card
let currentPage=0;
let rafId=null, playing=false, startTime=0, onEnd=null;

/* 完整序列时间轴（录制用） */
const SEQ={holdEnv:0.8, open:2.6, holdCover:0.8, flip:2.9, holdInside:2.9};
const SEQ_TOTAL=SEQ.holdEnv+SEQ.open+SEQ.holdCover+SEQ.flip+SEQ.holdInside;
function flipProgress(k){
  k=clamp01(k);
  return k<0.5?easeOut(k*2)/2:(1+easeIn((k-0.5)*2))/2;
}
function renderSequence(t){
  if(t<SEQ.holdEnv) drawEnvelopeScene(ctx,0,t*1000);
  else if(t<SEQ.holdEnv+SEQ.open) drawEnvelopeScene(ctx,(t-SEQ.holdEnv)/SEQ.open,t*1000);
  else if(t<SEQ.holdEnv+SEQ.open+SEQ.holdCover) renderProgress(0);
  else if(t<SEQ.holdEnv+SEQ.open+SEQ.holdCover+SEQ.flip)
    renderProgress(flipProgress((t-SEQ.holdEnv-SEQ.open-SEQ.holdCover)/SEQ.flip));
  else renderProgress(1);
}

/* 翻卡动画（card 阶段） */
function timeline(now){
  const t=(now-startTime)/1000;let p;
  const FLIP={hold1:0.3,flip:2.2,hold2:0.4};
  if(t<FLIP.hold1)p=0;
  else if(t<FLIP.hold1+FLIP.flip){
    const k=(t-FLIP.hold1)/FLIP.flip;
    p=k<0.5?easeOut(k*2)/2:(1+easeIn((k-0.5)*2))/2;
  } else p=1;
  renderProgress(Math.min(1,Math.max(0,p)));
  if(t<FLIP.hold1+FLIP.flip+FLIP.hold2&&playing){rafId=requestAnimationFrame(timeline);}
  else{playing=false;renderProgress(1);if(onEnd)onEnd();}
}
function playAnim(cb){
  if(playing)return;
  playing=true;onEnd=cb||null;
  startTime=performance.now();
  rafId=requestAnimationFrame(timeline);
}

/* 预览常驻循环：信封呼吸 / 拆信动画 */
let recordMode=false;
function previewLoop(now){
  if(recordMode)return;
  if(stage==='envelope'){
    drawEnvelopeScene(ctx,0,now);
    rafId=requestAnimationFrame(previewLoop);
  } else if(stage==='opening'){
    const p=(now-openingStart)/1000/SEQ.open;
    if(p>=1){ stage='card'; currentPage=0; renderProgress(0); updateButtons(); }
    else { drawEnvelopeScene(ctx,p,now); rafId=requestAnimationFrame(previewLoop); }
  }
}
let openingStart=0;
function startOpening(){
  stage='opening';
  openingStart=performance.now();
  updateButtons();
  rafId=requestAnimationFrame(previewLoop);
}

function easeInOut(x){return x<0.5?2*x*x:1-Math.pow(-2*x+2,2)/2;}

/* 合上贺卡：反向翻卡 → 卡片缩回信封 → 回到未拆状态 */
let closingStart=0;
function closeCard(){
  if(stage!=='card')return;
  stage='closing';
  updateButtons();
  closingStart=performance.now();
  rafId=requestAnimationFrame(closingLoop);
}
function closingLoop(now){
  const t=(now-closingStart)/1000;
  const CLOSE_FLIP=1.1, CLOSE_ENV=1.1;
  if(t<CLOSE_FLIP){
    renderProgress(1-easeInOut(t/CLOSE_FLIP));
  } else if(t<CLOSE_FLIP+CLOSE_ENV){
    const p=1-(t-CLOSE_FLIP)/CLOSE_ENV;
    drawEnvelopeScene(ctx,clamp01(p),now);
  } else {
    stage='envelope';currentPage=0;
    updateButtons();
    rafId=requestAnimationFrame(previewLoop);
    return;
  }
  rafId=requestAnimationFrame(closingLoop);
}

function updateButtons(){
  btnClose.disabled = stage!=='card';
  $('btnFlip').disabled = (stage==='opening'||stage==='closing');
}

/* ============================================================
 * 音频模块
 * ============================================================ */
let audioCtx=null, audioBuffer=null, audioSource=null, mediaDest=null, musicGain=null;
let decodePromise=null, pendingMusic=false;

/* 必须在用户手势里同步执行：创建并 resume AudioContext，
   iOS/Safari 只认同步调用，任何 await 之后再 resume 都会被拦下。 */
function primeAudio(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC||!AUDIO_B64||AUDIO_B64.startsWith('__'))return null;
  if(!audioCtx)audioCtx=new AC();
  if(audioCtx.state==='suspended'){try{audioCtx.resume();}catch(e){}}
  return audioCtx;
}
async function ensureAudio(){
  const ctx=primeAudio();
  if(!ctx)return;
  if(audioBuffer)return;
  if(decodePromise)return decodePromise;
  decodePromise=(async()=>{
    try{
      const bin=atob(AUDIO_B64);
      const bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      audioBuffer=await ctx.decodeAudioData(bytes.buffer);
      if(pendingMusic){pendingMusic=false;startMusic();}
    }catch(e){console.warn('音频解码失败',e);}
  })();
  return decodePromise;
}
function startMusic(){
  if(!audioCtx||!audioBuffer){pendingMusic=true;return;}
  stopMusic();
  audioSource=audioCtx.createBufferSource();
  audioSource.buffer=audioBuffer;audioSource.loop=true;
  musicGain=audioCtx.createGain();musicGain.gain.value=0.8;
  audioSource.connect(musicGain);
  musicGain.connect(audioCtx.destination);
  if(mediaDest)musicGain.connect(mediaDest);
  audioSource.start();
  updateMusicBtn();
}
function updateMusicBtn(){
  const b=document.getElementById('btnMusic');
  if(b)b.textContent=audioSource?'🔇 关音乐':'🎵 音乐';
}
function stopMusic(){
  if(audioSource){try{audioSource.stop();}catch(e){}audioSource=null;}
  updateMusicBtn();
}

/* ============================================================
 * 导出图片

function showVideoPreview(url){

  previewUrl=url;

function download(url,name){

  document.body.appendChild(a);a.click();a.remove();
}
function exportPage(which,name){

/* ============================================================
 * 视频录制（画面 + 背景音乐合成）
 * ============================================================ */
let recorder=null,chunks=[],recording=false,recordStart=0,recState=-1,previewUrl=null;
function pickMime(){
  if(typeof MediaRecorder==='undefined')return null;
  /* 关键：MP4 必须同时支持 h264 + aac，否则 Chromium 会把 opus 塞进 mp4 导致文件损坏 */
  const list=[
    'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',
    'video/mp4;codecs="avc1.4D401F,mp4a.40.2"',
    'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
    'video/mp4;codecs="avc1,mp4a.40.2"',
    'video/webm;codecs="vp9,opus"',
    'video/webm;codecs=vp9',
    'video/webm',
    'video/mp4'
  ];
  return list.find(m=>{try{return MediaRecorder.isTypeSupported(m)}catch(e){return false}})||null;
}
async function recordVideo(){
  if(recording)return;
  const mime=pickMime();
  if(!mime){toast('当前浏览器不支持视频录制');return;}

  if(!canvas.captureStream){
    toast('当前浏览器不支持视频录制，请用 Chrome 打开');
    return;
  }
  btnVideo.disabled=true;btnVideo.textContent='⏺ 准备中…';
  primeAudio();
  try{await ensureAudio();}catch(e){console.warn('音频解码失败',e);}

  if(audioCtx&&audioBuffer){
    mediaDest=audioCtx.createMediaStreamDestination();
    startMusic();
  }

  const canvasStream=canvas.captureStream(30);
  const tracks=[...canvasStream.getVideoTracks()];
  if(mediaDest)tracks.push(...mediaDest.stream.getAudioTracks());
  const stream=new MediaStream(tracks);

  chunks=[];
  recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8_000_000});
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  recorder.onstop=()=>{
    const type=recorder.mimeType||mime;
    const blob=new Blob(chunks,{type});
    const url=URL.createObjectURL(blob);
    const ext=type.includes('mp4')?'mp4':'webm';
    download(url,`圣诞贺卡.${ext}`);
    showVideoPreview(url);
    stopMusic();mediaDest=null;
    recording=false;recordMode=false;
    if(stage==='envelope'){rafId=requestAnimationFrame(previewLoop);}
    else if(stage==='card'){renderProgress(currentPage);}
    btnVideo.disabled=false;btnVideo.textContent='🎬 录制视频';
    toast('10 秒视频已生成并自动下载 🎬');
  };
  recording=true;recState=-1;
  recordMode=true;cancelAnimationFrame(rafId);
  btnVideo.textContent='⏺ 录制中 0s / 10s';
  recorder.start();
  recordStart=performance.now();
  rafId=requestAnimationFrame(recordLoop);
}
function recordLoop(now){
  const t=(now-recordStart)/1000;
  renderSequence(Math.min(t,SEQ_TOTAL));
  const sec=Math.min(SEQ_TOTAL,Math.floor(t));
  if(recState!==sec){recState=sec;btnVideo.textContent=`⏺ 录制中 ${sec}s / ${Math.round(SEQ_TOTAL)}s`;}
  if(t<SEQ_TOTAL){rafId=requestAnimationFrame(recordLoop);}
  else{setTimeout(()=>{if(recorder&&recorder.state!=='inactive')recorder.stop();},300);}
}

/* ============================================================
 * 控件绑定
 * ============================================================ */
const $=id=>document.getElementById(id);
const btnClose=$('btnClose');
const inputs={to:$('inTo'),title:$('inTitle'),msg:$('inMsg'),from:$('inFrom'),date:$('inDate'),capA:$('capA'),capB:$('capB')};
const colorInputs={tree:$('cTree'),ornament:$('cOrn'),light:$('cLight'),star:$('cStar'),gift:$('cGift'),accent:$('cAccent'),bg:$('cBg'),card:$('cCard')};

function syncState(){
  state.to=inputs.to.value;state.title=inputs.title.value;state.msg=inputs.msg.value;
  state.from=inputs.from.value;state.date=inputs.date.value;
  state.capA=inputs.capA.value;state.capB=inputs.capB.value;
  Object.keys(colorInputs).forEach(k=>state.col[k]=colorInputs[k].value);
}
function redraw(){
  syncState();
  if(stage==='card')renderProgress(currentPage);
  else drawEnvelopeScene(ctx,0,performance.now());
}

Object.values(inputs).forEach(el=>el.addEventListener('input',redraw));
Object.values(colorInputs).forEach(el=>el.addEventListener('input',()=>{redraw();clearActivePreset();}));

const presetBox=$('presets');
PRESETS.forEach(p=>{
  const b=document.createElement('button');b.className='chip';b.textContent=p.name;
  b.addEventListener('click',()=>{
    Object.keys(p.col).forEach(k=>{state.col[k]=p.col[k];colorInputs[k].value=p.col[k];});
    [...presetBox.children].forEach(c=>c.classList.remove('active'));
    b.classList.add('active');redraw();
  });
  presetBox.appendChild(b);
});
function clearActivePreset(){[...presetBox.children].forEach(c=>c.classList.remove('active'));}

/* 两侧头像 */
function loadAvatar(input,key){
  const f=input.files&&input.files[0];
  if(!f)return;
  const img=new Image();
  img.onload=()=>{
    state[key]=img;redraw();
    const t2=$(key==='avatarA'?'avATxt':'avBTxt');
    if(t2)t2.textContent='✅ 已添加（点此更换）';
    toast('头像已添加 ✨');
  };
  img.onerror=()=>{toast('这张图片读不出来，换一张试试');};
  img.src=URL.createObjectURL(f);
}
$('avA').addEventListener('change',e=>loadAvatar(e.target,'avatarA'));
$('avB').addEventListener('change',e=>loadAvatar(e.target,'avatarB'));
$('btnClearAv').addEventListener('click',()=>{
  state.avatarA=null;state.avatarB=null;
  $('avA').value='';$('avB').value='';
  $('avATxt').textContent='🖼 选择图片';$('avBTxt').textContent='🖼 选择图片';
  redraw();toast('已清空头像');
});

const btnVideo=$('btnVideo');
async function handleOpen(){
  if(stage==='envelope'){
    primeAudio();                       /* 同步解锁，必须在点击手势内 */
    ensureAudio().then(()=>startMusic());/* 解码完自动起播 */
    startMusic();                        /* 已解码过则立刻播放 */
    startOpening();
  } else if(stage==='card'){
    currentPage=1;playAnim();
  }
}
$('btnFlip').addEventListener('click',handleOpen);
btnClose.addEventListener('click',closeCard);
canvas.addEventListener('click',handleOpen);
$('btnImgCover').addEventListener('click',()=>exportPage('cover','圣诞贺卡-封面.png'));
$('btnImgInside').addEventListener('click',()=>exportPage('inside','圣诞贺卡-内页.png'));
btnVideo.addEventListener('click',recordVideo);
$('btnMusic').addEventListener('click',()=>{
  primeAudio();
  if(audioSource){stopMusic();toast('音乐已暂停');return;}
  ensureAudio().then(()=>{
    if(audioBuffer){startMusic();toast('音乐播放中 🎵');}
    else{toast('这段音乐暂时解码不了');}
  });
});

let toastTimer=null;
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

window.addEventListener('load',()=>{
  if(document.fonts&&document.fonts.ready){
    Promise.all([
      document.fonts.load('400 72px "Pacifico"'),
      document.fonts.load('400 34px "Noto Sans SC"')
    ]).finally(()=>{ if(stage==='envelope')drawEnvelopeScene(ctx,0,performance.now()); });
  } else drawEnvelopeScene(ctx,0,performance.now());
});
drawEnvelopeScene(ctx,0,performance.now());
updateButtons();
rafId=requestAnimationFrame(previewLoop);
</script>
</body>
</html>
